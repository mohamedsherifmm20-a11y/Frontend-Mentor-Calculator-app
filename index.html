<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <title>Frontend Mentor | Calculator app</title>
  <link rel="stylesheet" href="th1me.css">
  <link rel="stylesheet" href="normalize.css">
</head>
<body>
  <div class="calculator">
    <div class="nav">
      <p class="calc-text">calc</p>
      <div class="theme-toggeler">
        <p class="theme-text">Theme:</p>
        <div class="theme-choices">
          <div id="theme1">1</div>
          <div id="theme2">2</div>
          <div id="theme3">3</div>
        </div>
      </div>
    </div>
    <div class="results-site">
      <p class="progress"></p>
      <div class="screen">
        <span class="result"></span>
      </div>
    </div>
    <div class="main">
      <div class="number seven">7</div>
      <div class="number eigth">8</div>
      <div class="nine number">9</div>
      <div class="delete-button">Del</div>
      <div class="four number">4</div>
      <div class="five number">5</div>
      <div class="six number">6</div>
      <div class="add-operator operator">+</div>
      <div class="one number">1</div>
      <div class="two number">2</div>
      <div class="three number">3</div>
      <div class="sub-operator operator">-</div>
      <div class="dot number">.</div>
      <div class="zero number">0</div>
      <div class="div-operator operator">/</div>
      <div class="mul-operator operator">*</div>
      <div class="reset">Reset</div>
      <div class="equal">=</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
